<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#15110d">
  <title>Kabadayı</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <script src="vendor/supabase.js"></script>
</head>
<body>
  <div id="loading" class="screen center"><img class="logo-img" src="assets/ui/logo.png" alt="KABADAYI">
    <div class="loader" aria-hidden="true"><span></span></div>
    <div class="load-track"><div id="load-bar"></div></div>
    <p id="load-text" class="muted small">Şehir uyanıyor…</p></div>

  <div id="onboard" class="screen center hidden">
    <div id="onboard-art"></div>
    <img class="logo-img" src="assets/ui/logo.png" alt="KABADAYI">
    <p class="lead">Men-i Müskirat yürürlükte. İçki yasak, sokaklar aç.<br>Kim olduğunu seç, adını söyle.</p>
    <div id="onboard-gender" class="gender-pick"></div>
    <div id="onboard-portraits" class="portrait-grid"></div>
    <form id="nick-form">
      <input id="nick" maxlength="16" placeholder="Takma adın" autocomplete="off" autocapitalize="off">
      <p class="muted small nick-rule">3-16 harf. Sadece Türkçe ya da İngilizce harfler; rakam, boşluk, emoji ve işaret yok.</p>
      <button class="btn primary">Şehre in</button>
    </form>
    <p id="nick-err" class="err"></p>
    <div id="onboard-login" class="onboard-login"></div>
    <button id="scroll-hint" class="scroll-hint" type="button">Karakterini seçmek için aşağı kaydır<span></span></button>
  </div>

  <div id="banned" class="screen center hidden">
    <img class="logo-img" src="assets/ui/logo.png" alt="KABADAYI">
    <p class="lead">Hesabın moderatör tarafından askıya alındı.</p>
    <p id="ban-reason" class="err"></p>
    <p id="ban-until" class="muted small"></p>
    <div id="ban-appeal" class="ban-appeal"></div>
  </div>

  <div id="game" class="hidden">
    <header>
      <div class="row">
        <div class="who" data-me>
          <span id="h-avatar"></span>
          <div><div id="h-nick" class="nick"></div><div id="h-rank" class="muted small"></div></div>
        </div>
        <div class="right"><div id="h-cash" class="cash"></div><div id="h-city" class="muted small"></div></div>
      </div>
      <div id="h-stats" class="small stats"></div>
      <div class="xprow"><div id="xpbar" class="xpbar"><div></div></div><span id="xp-next" class="xp-next"></span></div>
      <div class="timers">
        <span class="chip" id="t-crime">İş</span>
        <span class="chip" id="t-car">Araba</span>
        <span class="chip" id="t-travel">Vapur</span>
      </div>
      <div id="jail" class="jail hidden"></div>
    </header>

    <main>
      <section data-tab="city"></section>
      <section data-tab="crime" class="hidden"></section>
      <section data-tab="family" class="hidden"></section>
      <section data-tab="chat" class="hidden"></section>
      <section data-tab="log" class="hidden"></section>
    </main>

    <nav>
      <button data-go="city" class="on"><b>🏙</b>Şehir</button>
      <button data-go="crime"><b>🕶</b>İşler</button>
      <button data-go="family"><b>🤝</b>Aile</button>
      <button data-go="chat"><b>💬</b>Sohbet</button>
      <button data-go="log"><b>📜</b>Defter</button>
    </nav>
  </div>

  <div id="sheet" class="sheet-wrap hidden"><div class="sheet">
    <div class="sheet-head"><span id="sheet-icon"></span><div id="sheet-title" class="title"></div>
      <button class="btn sm" data-close-sheet>✕</button></div>
    <div id="sheet-body"></div>
  </div></div>

  <div id="tutorial" class="tut hidden"></div>
  <div id="modal" class="modal hidden"><div class="modal-card"><div id="modal-body"></div>
    <button id="modal-close" class="btn">Kapat</button></div></div>
  <div id="toast" class="toast-stack"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
